basePath: /api/v1
definitions:
  domain.Product:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      price:
        type: number
      stock:
        type: integer
      store:
        $ref: '#/definitions/domain.Store'
      store_id:
        type: integer
      updated_at:
        type: string
    type: object
  domain.Store:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      products:
        items:
          $ref: '#/definitions/domain.Product'
        type: array
      slug:
        type: string
      updated_at:
        type: string
    type: object
  service.CreateProductRequest:
    properties:
      description:
        type: string
      name:
        type: string
      price:
        type: number
      stock:
        type: integer
      store_id:
        type: integer
    required:
    - name
    - price
    - store_id
    type: object
  service.CreateStoreRequest:
    properties:
      description:
        type: string
      name:
        type: string
      slug:
        type: string
    required:
    - name
    - slug
    type: object
  util.PaginatedResponse:
    properties:
      data: {}
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: A multi-tenant storefront SaaS backend API
  title: Storefront SaaS API
  version: "1.0"
paths:
  /products:
    get:
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/util.PaginatedResponse'
      summary: List all active products
      tags:
      - products
    post:
      consumes:
      - application/json
      parameters:
      - description: Product data
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/service.CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Product'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Create a new product
      tags:
      - products
  /products/{id}:
    get:
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Product'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get a product by ID
      tags:
      - products
  /products/search:
    get:
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/util.PaginatedResponse'
      summary: Search active products
      tags:
      - products
  /stores:
    get:
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/util.PaginatedResponse'
      summary: List active stores
      tags:
      - stores
    post:
      consumes:
      - application/json
      parameters:
      - description: Store data
        in: body
        name: store
        required: true
        schema:
          $ref: '#/definitions/service.CreateStoreRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Store'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Create a new store
      tags:
      - stores
  /stores/{slug}:
    get:
      parameters:
      - description: Store slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Store'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get a store by slug
      tags:
      - stores
  /stores/{slug}/products:
    get:
      parameters:
      - description: Store slug
        in: path
        name: slug
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/util.PaginatedResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: List products for a specific store
      tags:
      - products
swagger: "2.0"
